<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgencyX</title>
<style>
:root{--bg:#f3f4f2;--s:#fff;--tx:#161b1a;--mu:#5d6866;--bd:#dde1de;--ac:#0b6b5e;--ac2:#fff;--dn:#b3380a;--ok:#0b6b5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1312;--s:#161d1c;--tx:#e9efed;--mu:#8fa09c;--bd:#27322f;--ac:#3fc9b0;--ac2:#06201b;--dn:#ff8a5c;--ok:#3fc9b0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1312;--s:#161d1c;--tx:#e9efed;--mu:#8fa09c;--bd:#27322f;--ac:#3fc9b0;--ac2:#06201b;--dn:#ff8a5c;--ok:#3fc9b0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--s);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--s);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:10px 14px}
header h1{font:700 21px Georgia,"Times New Roman",serif;margin:0;flex:1;letter-spacing:.2px}
header select{max-width:42%}
main{padding:14px;max-width:720px;margin:0 auto}
h2{font:700 24px Georgia,serif;margin:6px 0 12px}h3{font:700 17px Georgia,serif;margin:18px 0 8px}
.card{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.card[data-a]{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.sub{color:var(--mu);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:1px 9px;color:var(--mu);white-space:nowrap}
.chip.u{color:var(--dn);border-color:var(--dn)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{resize:vertical}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
button{font:inherit;font-weight:600;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--s);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}button.d{color:var(--dn);border-color:var(--dn)}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar>*{flex:1}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btns>*{flex:1;min-width:110px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font:700 30px Georgia,serif}
.empty{text-align:center;color:var(--mu);padding:28px 10px;border:1px dashed var(--bd);border-radius:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--s);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;min-height:52px;font-size:12px;font-weight:600;color:var(--mu);padding:0 2px}nav button.on{color:var(--ac)}
nav b{display:block;font-size:20px;line-height:1.1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
#sheet.o{display:block}#sheet>div{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--s);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
#toast{position:fixed;left:14px;right:14px;bottom:96px;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:30;display:none;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:8px 0;border-radius:8px;font-size:14px;position:relative}
.cal .dd{background:var(--s);border:1px solid var(--bd);cursor:pointer}.cal .dd.s{border-color:var(--ac);outline:2px solid var(--ac)}.cal .dd.i::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:9px;background:var(--ac)}
.cal .hd{color:var(--mu);font-size:12px;padding:2px}
.mu{color:var(--mu);font-size:14px}.ck{min-height:40px;width:40px;padding:0;flex:none}
#vsheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none}#vsheet.o{display:block}#vsheet>div{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--s);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
</style></head><body>
<header><h1>AgencyX</h1><select id="gb" aria-label="Filtrar por marca"></select><button data-a="go" data-v="buscar" aria-label="Buscar" style="min-height:42px;padding:0 12px">Buscar</button></header>
<main id="m"></main>
<nav id="nv"></nav>
<div id="sheet"><div id="sb"></div></div><div id="vsheet"><div id="vb"></div></div><div id="toast"></div>
<script>
"use strict";
const ST_=["idea","borrador","aprobado","en producción","publicado","descartado"],TS=["pendiente","en progreso","bloqueado","completado"],PR=["baja","media","alta","urgente"];
const FU=["confirmado por mí","importado","estimación","hipótesis de IA"];
const S={
marcas:{t:"Marcas",tf:i=>i.nombre,sf:i=>[i.nicho,i.publico].filter(Boolean).join(" · "),st:["activa"],f:[["nombre","Nombre","t",0,1],["nicho","Nicho","t"],["publico","Público","t"],["tono","Tono","t"],["propuesta","Propuesta de valor","a"],["enlaces","Enlaces","a"]]},
productos:{t:"Productos Hotmart",tf:i=>i.nombre,sf:i=>[i.tipo,i.precio?i.precio+" "+(i.moneda||""):"",i.fuente].filter(Boolean).join(" · "),st:["activo"],f:[["nombre","Nombre","t",0,1],["marca","Marca","r","marcas"],["tipo","Tipo","s",["propio","afiliado"]],["nicho","Nicho","t"],["descripcion","Descripción","a"],["url","URL oficial pública","t"],["urlAf","URL de afiliado (privada, no se exporta en guiones)","t"],["precio","Precio indicado","n"],["moneda","Moneda","t"],["comision","Comisión indicada","t"],["publico","Público","t"],["beneficios","Beneficios verificados (uno por línea)","a"],["objeciones","Objeciones (una por línea)","a"],["fuente","Origen de los datos","s",FU],["notas","Notas","a"]]},
nichos:{t:"Investigación",tf:i=>i.nicho,sf:i=>[i.subnicho,i.tipo].filter(Boolean).join(" · "),st:["activa"],f:[["nicho","Nicho","t",0,1],["subnicho","Subnicho","t"],["marca","Marca","r","marcas"],["producto","Producto","r","productos"],["publico","Público objetivo","a"],["problemas","Problemas y deseos","a"],["objeciones","Objeciones","a"],["hipotesis","Hipótesis y ángulos","a"],["tipo","Tipo de dato","s",["verificada","hipótesis"]]]},
proyectos:{t:"Proyectos y campañas",tf:i=>i.nombre,sf:i=>[i.tipo,i.fin?"vence "+i.fin:""].filter(Boolean).join(" · "),st:TS,f:[["nombre","Nombre","t",0,1],["tipo","Tipo","s",["proyecto","campaña"]],["marca","Marca","r","marcas"],["producto","Producto","r","productos"],["inicio","Inicio","d"],["fin","Vencimiento","d"],["notas","Notas","a"]]},
tareas:{t:"Tareas",tf:i=>i.titulo,sf:i=>[i.prioridad,i.vence?"vence "+i.vence:""].filter(Boolean).join(" · "),st:TS,f:[["titulo","Tarea","t",0,1],["marca","Marca","r","marcas"],["proyecto","Proyecto","r","proyectos"],["prioridad","Prioridad","s",PR],["inicio","Inicio","d"],["vence","Vencimiento","d"],["pasos","Pasos breves (uno por línea)","a"],["notas","Notas","a"]]},
guiones:{t:"Guiones",tf:i=>i.titulo,sf:i=>[i.plataforma,i.objetivo,"v"+(i.version||1),i.ganador?"ganador":""].filter(Boolean).join(" · "),st:ST_,f:[["titulo","Título","t",0,1],["marca","Marca","r","marcas"],["producto","Producto","r","productos"],["plataforma","Plataforma","t"],["objetivo","Objetivo","t"],["estilo","Estilo","t"],["duracion","Duración (s)","n"],["texto","Guion","a"],["rendimiento","Rendimiento ingresado","a"],["ganador","¿Ganador?","s",["no","sí"]],["notas","Notas de aprendizaje","a"]]},
contenidos:{t:"Contenidos",tf:i=>i.titulo,sf:i=>[i.canal,i.formato,i.fecha].filter(Boolean).join(" · "),st:["idea","en producción","programado","publicado"],f:[["titulo","Título","t",0,1],["marca","Marca","r","marcas"],["producto","Producto","r","productos"],["guion","Guion","r","guiones"],["formato","Formato","t"],["canal","Canal","t"],["fecha","Fecha programada","d"],["url","URL publicada","t"],["metricas","Métricas ingresadas","a"]]},
recordatorios:{t:"Recordatorios",tf:i=>i.titulo,sf:i=>[i.fecha,i.hora].filter(Boolean).join(" "),st:["activo","hecho"],f:[["titulo","Recordatorio","t",0,1],["fecha","Fecha","d",0,1],["hora","Hora","h"],["nota","Nota","a"]]},
ventas:{t:"Registros comerciales",tf:i=>i.tipo+" · "+(i.fecha||""),sf:i=>[i.cantidad?i.cantidad+" u.":"",i.monto?i.monto+" "+(i.moneda||""):"",i.fuente].filter(Boolean).join(" · "),st:["registrado"],f:[["tipo","Tipo","s",["clics","leads","venta","reembolso","comisión"],1],["fecha","Fecha","d",0,1],["marca","Marca","r","marcas"],["producto","Producto","r","productos"],["cantidad","Cantidad","n"],["monto","Monto","n"],["moneda","Moneda","t"],["fuente","Origen","s",FU]]},
memoria:{t:"Memoria",tf:i=>i.categoria+": "+(i.contenido||"").slice(0,50),sf:i=>i.fuente||"",st:["activo"],f:[["categoria","Categoría","s",["preferencia","estrategia","decisión","aprendizaje","pendiente"],1],["contenido","Contenido (sin contraseñas ni datos bancarios)","a",0,1],["marca","Marca","r","marcas"],["fuente","Origen","s",FU]]}
};
const MORE=[["proyectos","Proyectos"],["tareas","Tareas"],["contenidos","Contenidos"],["calendario","Calendario"],["analiticas","Analíticas"],["nichos","Investigación"],["memoria","Memoria"],["ajustes","Configuración"]];
let DB={cfg:{prio:3,theme:"auto"},brand:""},ST={v:"inicio",q:"",fs:"",arch:0,gen:[],sf:{},cal:null,foco:null};
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date());
function load(){try{const r=localStorage.getItem("draken_v1");if(r)DB=Object.assign(DB,JSON.parse(r))}catch(e){}Object.keys(S).forEach(k=>DB[k]=DB[k]||[]);DB.cfg=Object.assign({prio:3,theme:"auto"},DB.cfg)}
function save(){try{localStorage.setItem("draken_v1",JSON.stringify(DB));return 1}catch(e){toast("No se pudo guardar en este navegador. Haz un respaldo en Configuración.")}}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)}
const nm=(k,id)=>{const x=DB[k].find(i=>i.id===id);return x?S[k].tf(x):""};
const hasM=k=>S[k].f.some(f=>f[0]==="marca");
const vis=k=>DB[k].filter(i=>(ST.arch||!i.arch)&&(!DB.brand||!hasM(k)||i.marca===DB.brand));
function theme(){document.documentElement.dataset.theme=DB.cfg.theme==="auto"?"":DB.cfg.theme;if(DB.cfg.theme==="auto")delete document.documentElement.dataset.theme}
function nav(){const n=[["inicio","Inicio","⌂"],["marcas","Marcas","◆"],["productos","Productos","▣"],["guiones","Guiones","✎"],["mas","Más","≡"]];$("#nv").innerHTML=n.map(([v,l,ic])=>`<button data-a="go" data-v="${v}" class="${ST.v===v?"on":""}"><b>${ic}</b>${l}</button>`).join("")}
function brandSel(){$("#gb").innerHTML=`<option value="">Todas las marcas</option>`+DB.marcas.filter(b=>!b.arch).map(b=>`<option value="${b.id}" ${DB.brand===b.id?"selected":""}>${esc(b.nombre)}</option>`).join("")}
const rank=p=>PR.length-PR.indexOf(p||"media");
function card(k,i){const s=S[k];return `<div class="card" data-a="edit" data-k="${k}" data-id="${i.id}"><div class="row">${k==="tareas"?`<button class="ck" data-a="toggle" data-id="${i.id}" aria-label="Completar">${i.estado==="completado"?"✓":"○"}</button>`:""}<div style="flex:1;min-width:0"><b>${esc(s.tf(i))}</b><div class="sub">${esc(s.sf(i))}${i.marca&&k!=="marcas"?" · "+esc(nm("marcas",i.marca)):""}</div></div>${i.arch?`<span class="chip">archivado</span>`:i.estado?`<span class="chip ${i.vence&&i.vence<today()&&i.estado!=="completado"?"u":""}">${esc(i.estado)}</span>`:""}</div></div>`}
function list(k,extra){const s=S[k],q=ST.q.toLowerCase();let a=vis(k).filter(i=>(!ST.fs||i.estado===ST.fs)&&(!q||JSON.stringify(i).toLowerCase().includes(q)));
if(k==="tareas"||k==="proyectos"||k==="guiones")a.sort((x,y)=>k==="tareas"?(x.estado==="completado")-(y.estado==="completado")||rank(y.prioridad)-rank(x.prioridad):(y.actualizado||0)-(x.actualizado||0));else a.sort((x,y)=>(y.actualizado||0)-(x.actualizado||0));
return `<div class="row"><h2>${s.t}</h2><button class="p" data-a="new" data-k="${k}">Nuevo</button></div>${extra||""}<div class="bar"><input id="q" placeholder="Buscar…" value="${esc(ST.q)}"><select id="fs"><option value="">Todos los estados</option>${s.st.map(x=>`<option ${ST.fs===x?"selected":""}>${x}</option>`).join("")}</select></div><label style="margin:0 0 10px"><input type="checkbox" id="ar" ${ST.arch?"checked":""} style="width:auto;min-height:0"> Mostrar archivados</label>${a.map(i=>card(k,i)).join("")||`<div class="empty">Aún no hay ${s.t.toLowerCase()}. Toca “Nuevo” para crear el primero.</div>`}`}
function agenda(){const a=[];vis("tareas").forEach(t=>t.vence&&t.estado!=="completado"&&a.push([t.vence,"Tarea",t.titulo,"tareas",t.id]));vis("contenidos").forEach(t=>t.fecha&&t.estado!=="publicado"&&a.push([t.fecha,"Contenido",t.titulo,"contenidos",t.id]));vis("proyectos").forEach(t=>t.fin&&t.estado!=="completado"&&a.push([t.fin,t.tipo||"Proyecto",t.nombre,"proyectos",t.id]));DB.recordatorios.filter(r=>!r.arch&&r.estado!=="hecho"&&r.fecha).forEach(t=>a.push([t.fecha,"Recordatorio",t.titulo+(t.hora?" "+t.hora:""),"recordatorios",t.id]));return a.sort((x,y)=>x[0]<y[0]?-1:1)}
const agRow=x=>`<div class="card" data-a="edit" data-k="${x[3]}" data-id="${x[4]}"><div class="row"><b>${esc(x[2])}</b><span class="chip ${x[0]<today()?"u":""}">${x[0]}</span></div><div class="sub">${x[1]}</div></div>`;
function vInicio(){const t=today(),T=vis("tareas"),pend=T.filter(x=>x.estado!=="completado"),ven=pend.filter(x=>x.vence&&x.vence<t),hoy=pend.filter(x=>x.estado!=="bloqueado").sort((a,b)=>(rank(b.prioridad)-rank(a.prioridad))||((a.vence||"9")<(b.vence||"9")?-1:1)).slice(0,+DB.cfg.prio),rem=DB.recordatorios.filter(r=>!r.arch&&r.estado!=="hecho"&&r.fecha&&r.fecha<=t),prox=agenda().filter(x=>x[0]>=t).slice(0,5);
const wk=Date.now()-6048e5,hechas=T.filter(x=>x.completadoEn&&x.completadoEn>wk).length,blq=pend.filter(x=>x.estado==="bloqueado");
return `<h2>Hoy</h2>${rem.length?`<div class="card" style="border-color:var(--dn)"><b>Recordatorios</b>${rem.map(r=>`<div class="sub" data-a="edit" data-k="recordatorios" data-id="${r.id}">${esc(r.titulo)} · ${r.fecha}</div>`).join("")}</div>`:""}
<div class="grid"><div class="card"><div class="big">${pend.length}</div><div class="mu">Pendientes</div></div><div class="card"><div class="big" style="color:${ven.length?"var(--dn)":"inherit"}">${ven.length}</div><div class="mu">Vencidas</div></div><div class="card"><div class="big">${T.filter(x=>x.estado==="completado").length}</div><div class="mu">Completadas</div></div><div class="card"><div class="big">${vis("proyectos").filter(x=>x.estado==="en progreso").length}</div><div class="mu">Proyectos en progreso</div></div></div>
<h3>Prioridades (máx. ${DB.cfg.prio})</h3>${hoy.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.titulo)}</b><div class="sub">${x.prioridad||"media"}${x.vence?" · vence "+x.vence:""}</div></div><button class="p" data-a="foco" data-id="${x.id}">Enfocar</button></div></div>`).join("")||`<div class="empty">Sin tareas. Crea una para fijar tus prioridades de hoy.</div>`}
<h3>Accesos rápidos</h3><div class="grid"><button data-a="new" data-k="tareas">+ Tarea</button><button data-a="go" data-v="studio">+ Guion</button><button data-a="new" data-k="contenidos">+ Contenido</button><button data-a="new" data-k="productos">+ Producto</button><button data-a="new" data-k="proyectos">+ Campaña</button><button data-a="new" data-k="recordatorios">+ Recordatorio</button></div>
<h3>Próximos</h3>${prox.map(agRow).join("")||`<div class="empty">Nada programado.</div>`}
<h3>Revisión semanal</h3><div class="card">Completadas en 7 días: <b>${hechas}</b><br>Pendientes: <b>${pend.length}</b> · Bloqueadas: <b>${blq.length}</b>${blq.map(x=>`<div class="sub">Bloqueada: ${esc(x.titulo)}</div>`).join("")}<div class="mu" style="margin-top:6px">Calculado con tus registros; no incluye estimaciones.</div></div>`}
function vFoco(){const t=DB.tareas.find(x=>x.id===ST.foco);if(!t){ST.v="inicio";return vInicio()}const ps=(t.pasos||"").split("\n").map(s=>s.trim()).filter(Boolean),ok=t.ok||[],nx=ps.find((_,i)=>!ok.includes(i));
return `<button data-a="go" data-v="inicio">Volver</button><h2 style="margin-top:12px">${esc(t.titulo)}</h2>${t.estado==="bloqueado"?`<div class="card" style="border-color:var(--dn)">Tarea bloqueada. Define un paso de 5 a 20 minutos que sí puedas hacer ahora.</div>`:""}<div class="card"><div class="mu">Siguiente paso mínimo</div><b>${esc(nx||"Escribe abajo el paso más pequeño que puedas hacer en 10 minutos.")}</b></div>${ps.map((p,i)=>`<div class="card" data-a="step" data-i="${i}"><div class="row"><span>${esc(p)}</span><span>${ok.includes(i)?"✓":"○"}</span></div></div>`).join("")}
<div class="bar"><input id="np" placeholder="Agregar paso breve"><button data-a="addstep">Agregar</button></div><div class="card" style="text-align:center"><div class="big" id="tm">25:00</div><div class="bar"><button class="p" data-a="timer">Iniciar o pausar</button><button data-a="treset">Reiniciar</button></div><div class="mu">Temporizador opcional de 25 minutos.</div></div><button class="p" style="width:100%" data-a="toggle" data-id="${t.id}">Marcar tarea completada</button>`}
function vCal(){const n=new Date();ST.cal=ST.cal||{y:n.getFullYear(),m:n.getMonth(),d:""};const {y,m,d}=ST.cal,ag=agenda(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),pre=y+"-"+pad(m+1)+"-",set=new Set(ag.map(x=>x[0])),items=ag.filter(x=>d?x[0]===d:x[0].startsWith(pre));
let c="";["D","L","M","M","J","V","S"].forEach(x=>c+=`<div class="hd">${x}</div>`);for(let i=0;i<first;i++)c+="<div></div>";for(let i=1;i<=dim;i++){const k=pre+pad(i);c+=`<div class="dd ${set.has(k)?"i":""} ${d===k?"s":""}" data-a="day" data-d="${k}">${i}</div>`}

vapply(){const el=$(ST.vz.id);if(!el)return toast("No se encontró el guion");el.value=el.value.replace(/\n*VOZ EN OFF \(narración final\):[\s\S]*$/,"")+"\n\nVOZ EN OFF (narración final):\n"+$("#vt").value;A.vclose();toast("Narración añadida. Guarda el guion para conservarla")},
async sync(){const u=DB.cfg.gsUrl,k=DB.cfg.gsKey;if(!u||!k)return toast("Guarda la URL y la clave primero");try{toast("Sincronizando…");const c=JSON.parse(JSON.stringify(DB));delete c.cfg.gsKey;delete c.cfg.gsUrl;const r=await fetch(u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:k,action:"push",data:c})}),j=await r.json();if(!j.ok)throw new Error(j.error);DB.cfg.gsLast=new Date().toLocaleString("es");save();render();toast("Sincronizado con Sheets")}catch(e){toast("No se pudo sincronizar: "+e.message+". Revisa la URL o abre AgencyX desde un sitio propio.")}},
async pull(){const b=event.target;if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Confirmar: reemplaza datos locales";return}try{const r=await fetch(DB.cfg.gsUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:DB.cfg.gsKey,action:"pull"})}),j=await r.json();if(!j.ok)throw new Error(j.error);Object.keys(j.data).forEach(k=>{if(DB[k])DB[k]=j.data[k]});save();render();toast("Datos traídos de Sheets")}catch(e){toast("No se pudo traer: "+e.message)}},
bkgen(){$("#bk").value=JSON.stringify(DB)},async bkcopy(){const e=$("#bk");if(!e.value)A.bkgen();try{await navigator.clipboard.writeText(e.value);toast("Copiado")}catch(x){e.select();toast("Selecciona y copia manualmente")}},
bkrest(){const b=event.target;if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Confirmar restauración";return}try{const o=JSON.parse($("#bk").value);if(typeof o!=="object"||!o)throw 0;DB=Object.assign({cfg:{prio:3,theme:"auto"},brand:""},o);Object.keys(S).forEach(k=>DB[k]=DB[k]||[]);save();render();toast("Datos restaurados")}catch(e){toast("El texto no es un respaldo válido")}},
wipe(){const b=event.target;if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Toca otra vez: se borra todo";return}Object.keys(S).forEach(k=>DB[k]=[]);save();render();toast("Datos borrados")}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener("change",e=>{const i=e.target.id,v=e.target.value;if(i==="gb"){DB.brand=v;save();render()}else if(i==="q"){ST.q=v;render()}else if(i==="fs"){ST.fs=v;render()}else if(i==="ar"){ST.arch=e.target.checked?1:0;render()}else if(i==="th"){DB.cfg.theme=v;save();render()}else if(i==="gu"||i==="gk"){DB.cfg[i==="gu"?"gsUrl":"gsKey"]=v.trim();save();toast("Guardado")}else if(i==="pr"){DB.cfg.prio=+v;save();toast("Guardado")}else if(i==="sm"){const g=x=>$(x).value;Object.assign(ST.sf,{extra:g("#sx"),plat:g("#spl"),obj:g("#so"),dur:g("#sd"),fmt:g("#sfm"),marca:v,prod:""});render()}else if(i==="csv"&&v){const f=S[v].f.map(x=>x[0]).filter(x=>x!=="urlAf"),q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';$("#bk").value=[f.join(",")].concat(DB[v].map(r=>f.map(x=>q(r[x])).join(","))).join("\n");toast("CSV generado arriba (sin URLs privadas)")}});
document.addEventListener("input",e=>{if(e.target.id==="vt"||e.target.id==="vr")vupd()});
load();ST.sf={plat:"TikTok",obj:"conversión",dur:"30",fmt:"faceless"};render();
</script></body></html>
